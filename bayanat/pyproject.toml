[project]
name = "bayanat-pipeline"
version = "0.1.0"
description = "AI-assisted editorial pipeline for Bayanat: collect, filter, triage, draft, newsletter."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "openai>=1.40",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.package-data]
pipeline = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
