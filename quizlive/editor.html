<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var l=localStorage.getItem("quizlive:lang")||(navigator.language||"").slice(0,2).toLowerCase();if(l==="ar"){document.documentElement.dir="rtl";document.documentElement.lang="ar";}}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="dashboard.html" style="text-decoration:none">Quiz<span>Live</span></a>
    <div class="row">
      <a class="btn ghost small" href="dashboard.html" data-i18n="common.cancel"></a>
      <button id="save" class="btn small" data-i18n="edit.save"></button>
      <div class="float-controls" id="controls"></div>
    </div>
  </header>

  <section data-view="loading" class="center"><div class="pill" data-i18n="common.loading"></div></section>

  <main data-view="editor" class="container stack" hidden>
    <p class="notice-inline" id="ai-notice" role="note" hidden data-i18n="edit.aiNotice"></p>
    <div class="card stack">
      <div>
        <label for="title" data-i18n="edit.title"></label>
        <input id="title" maxlength="100" data-i18n-placeholder="edit.titlePh">
      </div>
      <div>
        <label for="description" data-i18n="edit.description"></label>
        <input id="description" maxlength="200">
      </div>
    </div>

    <div id="questions" class="stack"></div>

    <div class="row">
      <button id="add-question" class="btn dark" data-i18n="edit.add"></button>
    </div>
    <div id="error" class="error" role="alert"></div>
  </main>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
