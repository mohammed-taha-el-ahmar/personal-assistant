<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizLive — Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <section data-view="loading" class="center"><div class="pill" id="h-loading">Loading game…</div></section>

  <!-- Lobby -->
  <main data-view="lobby" class="container stack" style="text-align:center" hidden>
    <h2 id="h-title"></h2>
    <div class="row" style="justify-content:center;gap:24px">
      <div class="stack">
        <div class="muted">Join at <strong id="h-url"></strong></div>
        <div class="pin-box"><div class="muted" style="color:var(--ink-soft)">Game PIN</div><div class="pin" id="h-pin"></div></div>
      </div>
      <div class="qr" id="h-qr"></div>
    </div>
    <div class="row spread">
      <span class="pill" id="h-count">0 players</span>
      <button class="btn" id="h-start" disabled>Start</button>
    </div>
    <div class="chips" id="h-players"></div>
    <p class="muted" id="h-waiting">Waiting for players… Click a name to remove it.</p>
  </main>

  <!-- Question -->
  <main data-view="question" class="container" hidden>
    <div class="row spread muted" style="margin-bottom:10px">
      <span id="h-qprogress"></span>
      <button class="btn small ghost" id="h-skip">Skip ⏭</button>
    </div>
    <div class="question-head" id="h-qtext"></div>
    <div class="q-mid">
      <div class="circle" id="h-timer">20</div>
      <div id="h-qimage" style="text-align:center"></div>
      <div class="counter"><span id="h-answers">0</span><small>answers</small></div>
    </div>
    <div class="tiles" id="h-tiles"></div>
  </main>

  <!-- Reveal -->
  <main data-view="reveal" class="container" hidden>
    <div class="question-head" id="h-rtext"></div>
    <div class="bars" id="h-bars"></div>
    <div class="tiles" id="h-rtiles"></div>
    <div class="host-footer"><button class="btn" id="h-to-board">Next</button></div>
  </main>

  <!-- Leaderboard -->
  <main data-view="leaderboard" class="container" hidden>
    <h1 style="text-align:center;margin-bottom:20px">Scoreboard</h1>
    <div class="board" id="h-board"></div>
    <div class="host-footer"><button class="btn" id="h-next">Next question</button></div>
  </main>

  <!-- Podium -->
  <main data-view="podium" class="container" style="text-align:center" hidden>
    <h1 id="h-ptitle"></h1>
    <div class="podium" id="h-podium"></div>
    <div class="row" style="justify-content:center">
      <button class="btn dark" id="h-csv">Download results (CSV)</button>
      <button class="btn danger" id="h-end">End game</button>
    </div>
  </main>

  <section data-view="error" class="center" hidden>
    <div class="card narrow stack">
      <h2>Can't open this game</h2>
      <p id="h-error" style="color:var(--ink-soft)"></p>
      <a class="btn" href="dashboard.html">Back to dashboard</a>
    </div>
  </section>

  <script type="module" src="js/host.js"></script>
</body>
</html>
