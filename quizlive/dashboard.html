<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var l=localStorage.getItem("quizlive:lang")||(navigator.language||"").slice(0,2).toLowerCase();if(l==="ar"){document.documentElement.dir="rtl";document.documentElement.lang="ar";}}catch(e){}</script>
</head>
<body>
  <a class="skip-link btn" href="#main" data-i18n="common.skip"></a>
  <header class="topbar">
    <a class="logo" href="index.html" style="text-decoration:none">Quiz<span>Live</span></a>
    <div class="row">
      <span id="user-name" class="muted"></span>
      <button id="sign-out" class="btn ghost small" hidden data-i18n="auth.signOut"></button>
      <div class="float-controls" id="controls"></div>
    </div>
  </header>
  <div class="notice" id="verify-notice" hidden>
    <span data-i18n="auth.verifyNotice"></span>
    <button class="linklike" id="resend-verify" data-i18n="auth.resend"></button>
  </div>

  <div id="main">
  <section data-view="loading" class="center"><div class="pill" data-i18n="common.loading"></div></section>

  <!-- Sign-in -->
  <section data-view="signin" class="center" hidden>
    <div class="card narrow stack" style="text-align:left">
      <h2 data-i18n="auth.title"></h2>
      <p style="color:var(--ink-soft)" data-i18n="auth.subtitle"></p>

      <button id="google" class="btn block dark" data-i18n="auth.google"></button>
      <div class="divider" data-i18n="auth.or"></div>

      <div class="tabs" role="tablist">
        <button role="tab" id="tab-signin" aria-controls="panel-signin" aria-selected="true" data-i18n="auth.tabSignIn"></button>
        <button role="tab" id="tab-signup" aria-controls="panel-signup" aria-selected="false" data-i18n="auth.tabSignUp"></button>
        <button role="tab" id="tab-link" aria-controls="panel-link" aria-selected="false" data-i18n="auth.tabLink"></button>
      </div>

      <form id="panel-signin" role="tabpanel" aria-labelledby="tab-signin" class="stack" novalidate>
        <div><label for="si-email" data-i18n="auth.email"></label><input id="si-email" type="email" autocomplete="email" required></div>
        <div><label for="si-password" data-i18n="auth.password"></label><input id="si-password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit" data-i18n="auth.signIn"></button>
        <button class="linklike" type="button" id="forgot" data-i18n="auth.forgot"></button>
      </form>

      <form id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" class="stack" novalidate hidden>
        <div><label for="su-name" data-i18n="auth.displayName"></label><input id="su-name" autocomplete="name" maxlength="40" required></div>
        <div><label for="su-email" data-i18n="auth.email"></label><input id="su-email" type="email" autocomplete="email" required></div>
        <div><label for="su-password" data-i18n="auth.password"></label><input id="su-password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint"></div>
        <small id="pw-hint" style="color:var(--ink-soft)" data-i18n="auth.pwHint"></small>
        <div><label for="su-confirm" data-i18n="auth.confirm"></label><input id="su-confirm" type="password" autocomplete="new-password" required></div>
        <button class="btn block" type="submit" data-i18n="auth.createAccount"></button>
        <small class="auth-legal"><span data-i18n="auth.accept"></span> <a href="terms.html" data-i18n="legal.terms"></a> · <a href="privacy.html" data-i18n="legal.privacy"></a></small>
      </form>

      <form id="panel-link" role="tabpanel" aria-labelledby="tab-link" class="stack" novalidate hidden>
        <p style="color:var(--ink-soft);margin:0" data-i18n="auth.linkExplain"></p>
        <div><label for="ml-email" data-i18n="auth.email"></label><input id="ml-email" type="email" autocomplete="email" required></div>
        <button class="btn block" type="submit" data-i18n="auth.sendLink"></button>
      </form>

      <div id="auth-error" class="error" role="alert"></div>
      <div id="auth-success" class="success" role="status"></div>
    </div>
  </section>

  <!-- Quiz list -->
  <main data-view="list" class="container" hidden>
    <div class="live-banner" id="live-banner" role="status" hidden>
      <span id="live-text"></span>
      <div class="row">
        <a class="btn small" id="live-resume" data-i18n="dash.live.resume"></a>
        <button class="btn small ghost" id="live-end" data-i18n="dash.live.end"></button>
      </div>
    </div>
    <div class="row spread" style="margin-bottom:20px">
      <h1 data-i18n="dash.title"></h1>
      <div class="row" id="new-actions">
        <a class="btn ghost" href="library.html" data-i18n="dash.library"></a>
        <a class="btn" href="editor.html" data-i18n="dash.new"></a>
      </div>
    </div>
    <div id="quiz-list" class="quiz-list"></div>
    <p id="empty" class="muted" hidden><span data-i18n="dash.empty"></span> <a href="library.html" data-i18n="dash.emptyLibrary"></a></p>
  </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
