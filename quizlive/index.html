<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="float-controls" id="controls"></div>
  <main class="center">
    <div class="stack" style="width:100%;max-width:380px">
      <h1 class="logo">Quiz<span>Live</span></h1>
      <form id="join-form" class="card narrow stack" autocomplete="off" novalidate>
        <label class="sr-only" for="pin" data-i18n="join.pin"></label>
        <input id="pin" class="big" inputmode="numeric" maxlength="6" data-i18n-placeholder="join.pin" required>
        <label class="sr-only" for="nickname" data-i18n="join.nickname"></label>
        <input id="nickname" class="big" maxlength="15" data-i18n-placeholder="join.nickname" required>
        <button class="btn block dark" type="submit" data-i18n="join.enter"></button>
        <div id="error" class="error" role="alert"></div>
      </form>
      <p class="muted"><span data-i18n="join.hosting"></span> <a href="dashboard.html" data-i18n="join.toDashboard"></a></p>
    </div>
  </main>
  <script type="module" src="js/join.js"></script>
</body>
</html>
